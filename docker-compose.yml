services:
  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - ecommerce-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      USER_SERVICE_QUEUE: user_queue
      MONGO_URI: mongodb://mongodb:27017/user_service_db
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 1d
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    networks:
      - ecommerce-network
    develop:
      watch:
        - path: ./user-service/src
          target: /app/user-service/src
          action: sync
        - path: ./user-service/package.json
          action: rebuild

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - user-service
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PRODUCT_SERVICE_QUEUE: product_queue
      USER_SERVICE_QUEUE: user_queue
      MONGO_URI: mongodb://mongodb:27017/product_service_db
      JWT_SECRET: change-me-in-production
      AUTH_CACHE_TTL_MS: 300000
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    networks:
      - ecommerce-network
    develop:
      watch:
        - path: ./product-service/src
          target: /app/product-service/src
          action: sync
        - path: ./product-service/package.json
          action: rebuild

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - user-service
      - product-service
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ORDER_SERVICE_QUEUE: order_queue
      USER_SERVICE_QUEUE: user_queue
      PRODUCT_SERVICE_QUEUE: product_queue
      MONGO_URI: mongodb://mongodb:27017/order_service_db
      JWT_SECRET: change-me-in-production
      AUTH_CACHE_TTL_MS: 300000
    networks:
      - ecommerce-network
    develop:
      watch:
        - path: ./order-service/src
          target: /app/order-service/src
          action: sync
        - path: ./order-service/package.json
          action: rebuild

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - user-service
      - product-service
      - order-service
    environment:
      NODE_ENV: production
      PORT: 3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      USER_SERVICE_QUEUE: user_queue
      PRODUCT_SERVICE_QUEUE: product_queue
      ORDER_SERVICE_QUEUE: order_queue
    ports:
      - '3000:3000'
    networks:
      - ecommerce-network
    develop:
      watch:
        - path: ./api-gateway/src
          target: /app/api-gateway/src
          action: sync
        - path: ./api-gateway/package.json
          action: rebuild

networks:
  ecommerce-network:
    name: ecommerce-network

volumes:
  mongodb_data:
    name: ecommerce-mongodb-volume
